<div class="max-w-6xl mx-auto mt-8">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Dashboard Overview</h1>
    <p class="text-gray-500 mt-2">Ringkasan performa kandidat dan status rekrutmen Anda.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- Stat 1 -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center gap-4">
      <div class="w-14 h-14 rounded-full bg-teal-50 flex items-center justify-center text-teal-600">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500">Total Kandidat</p>
        <h3 class="text-2xl font-bold text-gray-900">{{ totalCandidates }}</h3>
      </div>
    </div>

    <!-- Stat 2 -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 flex items-center gap-4">
      <div class="w-14 h-14 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500">Rata-rata Skor ATS</p>
        <h3 class="text-2xl font-bold text-gray-900">{{ averageScore }}%</h3>
      </div>
    </div>

    <!-- Call to action -->
    <div class="bg-white rounded-2xl p-6 shadow-sm text-black flex flex-col justify-center">
      <h3 class="text-lg font-bold mb-2">Pindai CV Baru</h3>
      <p class="text-gray-500 text-sm mb-4">Mulai proses penyaringan dengan AI Parser.</p>
      <a routerLink="/upload" class="inline-block px-4 py-2 bg-gradient-to-br from-teal-500 to-teal-700 text-white font-medium rounded-lg text-sm hover:bg-teal-50 transition-colors w-max">
        Upload Sekarang
      </a>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <h3 class="text-lg font-bold mb-4 text-gray-900">Distribusi Skor Kandidat</h3>
      <div class="relative h-64">
        <canvas #scoreDistributionChart></canvas>
      </div>
    </div>
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <h3 class="text-lg font-bold mb-4 text-gray-900">Top 5 Kandidat</h3>
      <div class="relative h-64">
        <canvas #topCandidatesChart></canvas>
      </div>
    </div>
  </div>
</div>
