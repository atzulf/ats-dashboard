<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <!-- Logo Icon -->
    <div class="mx-auto w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
    </div>
    <h2 class="mt-6 text-3xl font-extrabold text-gray-900">
      Portal HRD ATS
    </h2>
    <p class="mt-2 text-sm text-gray-600">
      Masuk untuk meninjau CV kandidat
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-xl sm:px-10 border border-gray-100">
      
      @if (errorMsg()) {
        <div class="mb-4 bg-red-50 border-l-4 border-red-500 p-4">
          <p class="text-sm text-red-700">{{ errorMsg() }}</p>
        </div>
      }

      <form class="space-y-6" (ngSubmit)="onLogin()">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" name="email" type="email" autocomplete="email" required
                   [(ngModel)]="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   [(ngModel)]="password"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-teal-500 focus:border-teal-500 sm:text-sm">
          </div>
        </div>

        <div>
          <button type="submit" [disabled]="isLoading()"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 disabled:opacity-50">
            {{ isLoading() ? 'Memproses...' : 'Sign in' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
